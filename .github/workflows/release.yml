# Automated Windows Tauri release & updater pipeline.
#
# Triggers automatically on:
#   1. Any push or merge to `main` (auto-resolves next vX.Y.Z tag if current version is already released)
#   2. Pushing a `v*` tag (`git tag v1.1.0 && git push --tags`)
#   3. Manual `workflow_dispatch`
#
# Flow:
#   - Builds signed desktop installers (.msi + NSIS .exe) and `latest.json` updater manifest as a draft
#   - Verifies all updater assets & signatures via `scripts/check-release.mjs`
#   - Automatically publishes the verified release (`--draft=false --latest`) so installed desktop apps
#     immediately detect the update on launch via `/releases/latest/download/latest.json`.
#
# Required GitHub Secrets:
#   - TAURI_SIGNING_PRIVATE_KEY          (from `npx tauri signer generate`)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the passphrase set during generate)
# The matching public key lives in src-tauri/tauri.conf.json (plugins.updater.pubkey).

name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (vX.Y.Z). Leave empty to auto-resolve from package.json."
        required: false
        type: string

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Resolve release version and sync manifests
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");

            const pkgPath = "package.json";
            const tauriPath = "src-tauri/tauri.conf.json";
            const cargoPath = "src-tauri/Cargo.toml";

            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            const tauri = JSON.parse(fs.readFileSync(tauriPath, "utf8"));

            let requestedTag = process.env.INPUT_TAG || (process.env.REF_TYPE === "tag" ? process.env.REF_NAME : "");
            let version = requestedTag ? requestedTag.replace(/^v/, "") : pkg.version;

            // When triggered from a push/merge to main, check existing GitHub releases/tags
            // and auto-increment patch version if the current version was already released.
            if (!requestedTag) {
              let existingTags = new Set();
              try {
                const out = execFileSync("git", ["tag", "--list", "v*"], { encoding: "utf8" });
                for (const line of out.split(/\r?\n/)) {
                  if (line.trim()) existingTags.add(line.trim());
                }
              } catch {}
              try {
                const relOut = execFileSync("gh", ["release", "list", "--limit", "100", "--json", "tagName"], { encoding: "utf8" });
                for (const r of JSON.parse(relOut)) {
                  if (r.tagName) existingTags.add(r.tagName);
                }
              } catch {}

              const parts = version.split(".").map((n) => parseInt(n, 10));
              while (existingTags.has(`v${parts.join(".")}`)) {
                parts[2] = (parts[2] || 0) + 1;
              }
              version = parts.join(".");
            }

            const tag = `v${version}`;
            pkg.version = version;
            tauri.version = version;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + "\n");
            fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + "\n");

            if (fs.existsSync(cargoPath)) {
              const cargo = fs.readFileSync(cargoPath, "utf8").replace(
                /^(version\s*=\s*)"[^"]*"/m,
                `$1"${version}"`
              );
              fs.writeFileSync(cargoPath, cargo);
            }

            fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TAG=${tag}\n`);
            console.log(`Resolved release tag: ${tag}`);
          '

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version and updater configuration
        run: node scripts/check-release.mjs "$env:RELEASE_TAG"

      - name: Build & upload Tauri release assets
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Teach Me Everything ${{ env.RELEASE_TAG }}"
          releaseBody: "Download the Windows desktop installer (.msi or setup.exe) from the assets below. Installed desktop apps receive this update automatically on launch."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Validate updater assets & publish release live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          if (-not $env:RELEASE_ID) { throw "Tauri action did not return a release ID" }
          node scripts/check-release.mjs "$env:RELEASE_TAG" "$env:RELEASE_ID"
          gh release edit "$env:RELEASE_TAG" --draft=false --latest
          Write-Host "Published $env:RELEASE_TAG as latest release."
