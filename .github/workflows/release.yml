# Tag-triggered Windows Tauri release.
#
# Push a `v*` tag (e.g. `git tag v1.0.0 && git push --tags`) to build the
# desktop binaries and create a draft GitHub Release. A draft is NOT visible
# to the public updater endpoint; publish it after package verification.
#
# Required GitHub Secrets:
#   - TAURI_SIGNING_PRIVATE_KEY          (from `npx tauri signer generate`)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the passphrase set during generate)
# The matching public key lives in src-tauri/tauri.conf.json (plugins.updater.pubkey).

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable release tag (vX.Y.Z)"
        required: true
        type: string

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version and updater configuration
        run: node scripts/check-release.mjs "$env:RELEASE_TAG"

      - name: Build & publish Tauri release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Teach Me Everything ${{ env.RELEASE_TAG }}"
          releaseBody: "Download the installer for your platform from the assets below. Updates are delivered in-app once installed."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Validate draft updater assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          if (-not $env:RELEASE_ID) { throw "Tauri action did not return a release ID" }
          node scripts/check-release.mjs "$env:RELEASE_TAG" "$env:RELEASE_ID"
